# Temporary :80 only, until Let's Encrypt cert exists.
# Same as production HTTP vhost plus ACME. Do not leave this as the live
# site after certbot — switch to ovh-nginx.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /app/version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        return 302 /app/release-2012.json;
    }

    location = /app/release-2012.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/release-12.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/update.bin {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
    }

    location /app/ {
        alias /var/www/audio-guide-app/;
        index index.html;
        autoindex off;
        gzip off;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
        types {
            text/html html;
            application/json json;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Accept-Ranges bytes;
    }
}
