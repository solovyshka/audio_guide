# Share OVH :443 between HTTPS (audio.solovyshka.com) and Telegram mtg.
# Install: include this file from a top-level `stream { }` in nginx.conf.
# mtg must bind 127.0.0.1:4433, not *:443.
map $ssl_preread_server_name $audio_guide_tls {
    audio.solovyshka.com 127.0.0.1:8443;
    default              127.0.0.1:4433;
}

server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $audio_guide_tls;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
}
