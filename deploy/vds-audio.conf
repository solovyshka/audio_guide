# Audio guide door on the Russian VDS, under /audio/.
# The site root stays the other app. API goes through the reverse
# tunnel 127.0.0.1:18090 → FIREBAT :8090. The APK is a local file.

location = /audio/app/version.json {
    alias /var/www/audio-guide-app/version.json;
    default_type application/json;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
}

location = /audio/app/update.bin {
    alias /var/www/audio-guide-app/audio_guide.apk;
    default_type application/octet-stream;
    add_header Cache-Control "no-store";
    add_header Accept-Ranges bytes;
}

location /audio/app/ {
    alias /var/www/audio-guide-app/;
    index index.html;
    autoindex off;
    gzip off;
    add_header Cache-Control "no-store";
    add_header Accept-Ranges bytes;
    types {
        text/html html;
        application/json json;
        application/octet-stream bin;
    }
    default_type application/octet-stream;
}

location /audio/ {
    proxy_pass http://127.0.0.1:18090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Accept-Ranges bytes;
}
