# OVH nginx: public door for audio.solovyshka.com.
# HTTP on the raw IP stays up for old APKs. HTTPS serves the APK whole
# (MegaFon cuts plaintext HTTP, not TLS).
# API: nginx → SSH tunnel :18090 → FIREBAT.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 32m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location = /app/version.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/release-2012.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/release-12.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/update.bin {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Range $http_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
    }

    location /app/ {
        alias /var/www/audio-guide-app/;
        index index.html;
        autoindex off;
        gzip off;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
        types {
            text/html html;
            application/json json;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Accept-Ranges bytes;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name audio.solovyshka.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Public :443 is nginx stream SNI split (see ovh-nginx-stream.conf):
# audio.solovyshka.com → this vhost, everything else → mtg on 127.0.0.1:4433.
server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name audio.solovyshka.com;
    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/audio.solovyshka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio.solovyshka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    client_max_body_size 32m;

    location = /app/version.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/release-2012.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/release-12.json {
        alias /var/www/audio-guide-app/version.json;
        default_type application/json;
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    location = /app/update.bin {
        alias /var/www/audio-guide-app/audio_guide.apk;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
    }

    location /app/ {
        alias /var/www/audio-guide-app/;
        index index.html;
        autoindex off;
        gzip off;
        add_header Cache-Control "no-store";
        add_header Accept-Ranges bytes;
        types {
            text/html html;
            application/json json;
            application/octet-stream bin;
        }
        default_type application/octet-stream;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Accept-Ranges bytes;
    }
}
